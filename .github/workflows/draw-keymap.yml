name: Draw keymap
on:
  push:
    branches: [main]
    paths:
      - config/lily58.keymap
      - keymap_drawer.yaml
      - .github/workflows/draw-keymap.yml
  workflow_dispatch:

jobs:
  draw:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Clone zmk-helpers (only needed to expand its macros while parsing)
        run: git clone --quiet --depth 1 --branch v0.3 https://github.com/urob/zmk-helpers

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install keymap-drawer
        run: pip install keymap-drawer

      - name: Generate keymap diagram
        run: |
          mkdir -p keymap-drawer
          keymap -c keymap_drawer.yaml parse -z config/lily58.keymap -c 6 -o /tmp/keymap.yaml
          keymap draw /tmp/keymap.yaml -o keymap-drawer/lily58.svg

      - name: Commit updated diagram
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "docs: regenerate keymap diagram"
          file_pattern: keymap-drawer/lily58.svg
